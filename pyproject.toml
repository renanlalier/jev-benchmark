[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-benchmark"
version = "0.1.0"
description = "Open benchmark for decision models and low-cost LLMs on structured classification tasks"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Renan Lalier"}]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
jev-bench = "jev_benchmark.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"src/jev_benchmark/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
